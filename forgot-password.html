<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYTU - Forgot Password</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="#" class="auth-logo text-gradient">SYTU</a>
                <p class="auth-subtitle">Enter your email address and we'll send you an OTP to reset your password.</p>
            </div>
            
            <form id="forgot-password-form">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" id="forgot-email" class="form-input" placeholder="Enter your email" required>
                </div>

                <div id="forgot-error" style="color: #ef4444; font-size: 0.85rem; margin-bottom: 1rem; display: none;"></div>

                <button type="submit" class="btn btn-primary" style="margin-bottom: 1rem;">Send OTP</button>
                <a href="index.html" class="btn btn-secondary" style="text-decoration: none;">Back to Login</a>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
