name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'LICENSE'

jobs:
  validate:
    name: Validate and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check file structure
        run: |
          echo "Verifying essential application files..."
          if [ -f "index.html" ]; then
            echo "HTML files found."
          else
            echo "Error: Core HTML files missing!"
            exit 1
          fi
          echo "Validation complete."

  deploy:
    name: Deploy to Vercel
    needs: validate
    runs-on: ubuntu-latest
    # Only deploy to Vercel on push to main branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Deployment Secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          echo "Checking for required deployment secrets..."
          MISSING=false

          if [ -z "$VERCEL_TOKEN" ]; then
            echo "❌ VERCEL_TOKEN is missing or empty."
            MISSING=true
          else
            echo "✅ VERCEL_TOKEN is configured."
          fi

          if [ -z "$VERCEL_ORG_ID" ]; then
            echo "❌ VERCEL_ORG_ID is missing or empty."
            MISSING=true
          else
            echo "✅ VERCEL_ORG_ID is configured."
          fi

          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "❌ VERCEL_PROJECT_ID is missing or empty."
            MISSING=true
          else
            echo "✅ VERCEL_PROJECT_ID is configured."
          fi

          if [ -z "$FIREBASE_API_KEY" ]; then
            echo "❌ FIREBASE_API_KEY is missing or empty."
            MISSING=true
          else
            echo "✅ FIREBASE_API_KEY is configured."
          fi

          if [ "$MISSING" = true ]; then
            echo "🚨 Deployment failed: Required secrets are missing."
            echo "Please navigate to your GitHub Repository -> Settings -> Secrets and variables -> Actions to add them."
            exit 1
          fi

      - name: Inject Secure Configurations
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          echo "Generating config.js from secrets..."
          echo "export const FIREBASE_API_KEY = '${FIREBASE_API_KEY}';" > config.js

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
